# EduPlus Connect — nginx front door.
#
# Terminates TLS, spreads traffic across the app replicas, absorbs bursts, and
# serves Next's immutable assets itself so Node never sees that traffic.

# --- Upstreams --------------------------------------------------------------
upstream eduplus {
    # least_conn, not round-robin: server-rendered pages vary a lot in cost,
    # and round-robin will happily queue a request behind a slow report while
    # another replica sits idle.
    least_conn;

    server app1:3100 max_fails=3 fail_timeout=15s;
    server app2:3100 max_fails=3 fail_timeout=15s;
    server app3:3100 max_fails=3 fail_timeout=15s;
    server app4:3100 max_fails=3 fail_timeout=15s;

    # Reuse upstream connections. Without this every proxied request pays a
    # fresh TCP handshake, which is most of the latency at low payload sizes.
    keepalive 64;
    keepalive_timeout 60s;
}

# --- Rate limiting ----------------------------------------------------------
# Two zones with different jobs.
#
# `login` is a brute-force brake. The app already locks an account after five
# failures, but that is per account; this is per IP, and it stops someone
# spraying one password across every address in the school.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# `general` is burst absorption, not a wall: normal use of the app fires
# several requests per click.
limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;

# A single client should not be able to hold hundreds of sockets open.
limit_conn_zone $binary_remote_addr zone=perip:10m;

# --- Logging ----------------------------------------------------------------
# Adds upstream timing, which is what tells you whether a slow page is nginx,
# the app, or the database.
log_format eduplus '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time '
                   'up=$upstream_addr "$http_referer" "$http_user_agent"';

# --- HTTP: redirect to HTTPS, and answer the ACME challenge -----------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot writes its challenge here; it must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # nginx's own liveness, answered without touching the app.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ${SERVER_NAME};   # e.g. eduplus.example.com

    access_log /var/log/nginx/eduplus.access.log eduplus;
    error_log  /var/log/nginx/eduplus.error.log warn;

    ssl_certificate     /etc/nginx/certs/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/${SERVER_NAME}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS 1.3 picks better than we can
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS belongs to whoever terminates TLS. The app sets the other security
    # headers itself so they survive a proxy change.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # School data: never let an intermediary cache a page.
    add_header Cache-Control "no-store" always;

    limit_conn perip 50;

    # Report exports and CSV imports are the only large bodies.
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Reports over a wide range are genuinely slow; do not cut them off.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    # Not gzip_types for xlsx: it is already a zip, and re-compressing costs
    # CPU for nothing.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Next's build output is content-hashed, so it can be cached hard and
    # served by nginx. This is the cheapest win available: it takes the
    # majority of requests off Node entirely.
    location /_next/static/ {
        proxy_pass http://eduplus;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /public/ {
        proxy_pass http://eduplus;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # The brute-force brake. burst=5 nodelay lets a real person who mistypes
    # twice through immediately, while a script hits the wall.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://eduplus;
    }

    # Polled by monitoring; keep it out of the access log and off the limiter.
    location = /api/health {
        access_log off;
        proxy_pass http://eduplus;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://eduplus;

        # If a replica dies mid-request, retry the next one rather than
        # showing a 502 — safe here because these are idempotent reads;
        # non_idempotent is deliberately NOT set, so a POST is never replayed.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
