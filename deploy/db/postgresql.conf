# EduPlus Connect — PostgreSQL 16 tuning
#
# Sized for a VPS with ~24 GB RAM and ~12 vCPU dedicated to the data tier.
# CONFIRM the real numbers after the VPS is bought and adjust: the two that
# matter most are shared_buffers and effective_cache_size.
#
# Every value below is a deliberate choice, not a default.

# --- Connections -----------------------------------------------------------
listen_addresses = '*'          # container-internal; the port binding is what
                                # restricts reachability to WireGuard
port = 5432

# Deliberately modest. Application connections arrive through pgBouncer, which
# holds ~30. The headroom is for psql, backups and migrations. A high
# max_connections is not free: every backend reserves work_mem.
max_connections = 100
superuser_reserved_connections = 5

# --- Memory ----------------------------------------------------------------
# ~25% of RAM: the classic starting point for a dedicated database box.
shared_buffers = 6GB

# Not an allocation — it tells the planner how much the OS is likely caching,
# which decides index scan vs sequential scan. ~65-70% of RAM.
effective_cache_size = 16GB

# Per sort/hash node, not per connection, so the real ceiling is
# roughly max_connections x parallel nodes x this. Kept small on purpose.
work_mem = 16MB

# Used by VACUUM, CREATE INDEX and ALTER TABLE. Can be generous: few run at once.
maintenance_work_mem = 1GB

# --- Write-ahead log -------------------------------------------------------
wal_level = replica             # enough for pg_basebackup and a future replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9   # spread checkpoint I/O instead of spiking
wal_compression = on

# --- Planner / storage -----------------------------------------------------
# Contabo's storage is NVMe-backed. The default 4.0 assumes a spinning disk and
# makes the planner avoid index scans it should be choosing.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallelism -----------------------------------------------------------
max_worker_processes = 12
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- Autovacuum ------------------------------------------------------------
# Attendance and period-attendance take steady inserts and updates all day;
# the defaults let dead tuples accumulate until a vacuum becomes an event.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Observability ---------------------------------------------------------
# The first question after "the app feels slow" is always "which query?".
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = off           # too noisy behind a pooler
log_disconnections = off
log_lock_waits = on
log_temp_files = 0              # any temp file means work_mem was too small
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'                # the app converts to school time itself

# Query statistics, so slow endpoints can be traced to a statement.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# --- Safety ----------------------------------------------------------------
# A transaction left open by a crashed client holds locks and blocks vacuum.
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s         # no single request should outlive this
lock_timeout = 10s

datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
